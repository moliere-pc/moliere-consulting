<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="MOLIERE CONSULTING">
  <defs>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e8ac1f"/>
      <stop offset="0.55" stop-color="#f6c735"/>
      <stop offset="1" stop-color="#fbd24d"/>
    </linearGradient>
    <clipPath id="globeClip"><circle cx="60" cy="60" r="39"/></clipPath>
  </defs>

  <!-- Arcs bleus externes (ouverts) -->
  <path d="M78 13 A48 48 0 0 1 102 30" fill="none" stroke="#2054a3" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M20 92 A48 48 0 0 1 34 106" fill="none" stroke="#2054a3" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Orbites dorées PASSANT DERRIÈRE le globe -->
  <g transform="rotate(-20 60 60)">
    <ellipse cx="60" cy="60" rx="50" ry="18" fill="none" stroke="url(#gold)" stroke-width="3.4"/>
    <ellipse cx="60" cy="60" rx="50" ry="18" fill="none" stroke="#d99a17" stroke-width="3.4" stroke-dasharray="52 130" stroke-dashoffset="-8" opacity="0.55"/>
  </g>

  <!-- Globe : fond blanc -->
  <circle cx="60" cy="60" r="39" fill="#ffffff"/>

  <g clip-path="url(#globeClip)">
    <!-- Grille géographique -->
    <g fill="none" stroke="#c6dbef" stroke-width="1.3">
      <ellipse cx="60" cy="60" rx="39" ry="14"/>
      <ellipse cx="60" cy="60" rx="39" ry="28"/>
      <ellipse cx="60" cy="60" rx="14" ry="39"/>
      <ellipse cx="60" cy="60" rx="28" ry="39"/>
      <line x1="21" y1="60" x2="99" y2="60"/>
    </g>

    <!-- Continents bleu roi (silhouettes simplifiées) -->
    <g fill="#2054a3">
      <!-- Amérique du Nord -->
      <path d="M24 34c4-5 11-7 16-5 3 1 4 3 7 3 3 0 5 2 5 5-1 4-4 6-7 7-3 2-4 5-3 8 1 2 0 4-2 5-3 1-6-1-8-3-2-3-2-7-4-10-2-4-6-6-4-10z"/>
      <!-- Amérique du Sud -->
      <path d="M45 66c4-1 8 1 9 5 1 4-1 8-2 11-1 4-3 8-7 8-3 0-5-3-5-6-1-4 1-8 1-11 0-3 1-6 4-7z"/>
      <!-- Europe -->
      <path d="M58 28c4-2 9-1 11 2 1 2 0 4-2 5-3 1-7 1-9-1-2-2-2-5 0-6z"/>
      <!-- Afrique -->
      <path d="M57 44c5-2 12 0 14 5 2 5 0 10-1 14-1 5-1 11-6 14-3 2-8 1-10-3-2-5 1-9 1-14-1-6-3-14 2-16z"/>
      <!-- Asie -->
      <path d="M71 30c6-2 15 0 20 5 3 3 4 8 2 12-3 4-9 4-13 3-4-1-6-4-10-4-3 0-6-3-5-6 0-5 2-9 6-10z"/>
      <!-- Inde / Asie du Sud-Est -->
      <path d="M74 50c3 0 6 2 6 5 0 2-2 4-4 4-3 0-5-2-5-4 0-3 1-5 3-5z"/>
      <!-- Australie -->
      <path d="M82 82c4-2 10-1 12 2 1 2 0 5-3 6-4 1-9 0-10-3-1-2 0-4 1-5z"/>
    </g>
  </g>

  <!-- Contour du globe -->
  <circle cx="60" cy="60" r="39" fill="none" stroke="#2054a3" stroke-width="3.2"/>

  <!-- Traînée dorée PASSANT DEVANT (partie basse de l'orbite) -->
  <g transform="rotate(-20 60 60)">
    <path d="M11 66 A50 18 0 0 0 109 66" fill="none" stroke="url(#gold)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M22 72 A50 18 0 0 0 86 74" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Avion doré (haut-droite, le long de la trajectoire) -->
  <g transform="translate(86 32) rotate(48) scale(0.92)" fill="url(#gold)">
    <!-- fuselage -->
    <path d="M0 -16 C1.7 -15.4 2.3 -12.8 2.3 -9.4 L1.7 8.6 C1.6 11.2 1 12.8 0 13.2 C-1 12.8 -1.6 11.2 -1.7 8.6 L-2.3 -9.4 C-2.3 -12.8 -1.7 -15.4 0 -16 Z"/>
    <!-- aile gauche -->
    <path d="M-1.4 -3.2 L-13.5 6.4 L-12.8 8.8 L-2.4 4.6 Z"/>
    <!-- aile droite -->
    <path d="M1.4 -3.2 L13.5 6.4 L12.8 8.8 L2.4 4.6 Z"/>
    <!-- empennage gauche -->
    <path d="M-1.2 7.6 L-6.2 12 L-5.8 13.6 L-1.4 10.4 Z"/>
    <!-- empennage droite -->
    <path d="M1.2 7.6 L6.2 12 L5.8 13.6 L1.4 10.4 Z"/>
  </g>
</svg>
